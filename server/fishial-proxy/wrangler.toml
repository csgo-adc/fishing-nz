name = "catchcheck-fishial-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
ACCOUNT_EMAIL_FROM = "Fishdays - NZ <accounts@fishnz.space>"
AUTH_BASE_URL = "https://fishing.fishnz.space"
PUBLIC_DEVELOPER_NAME = "Tristan"
PUBLIC_SUPPORT_EMAIL = "tc199558@gmail.com"
# Shared fishing windows (docs/share-fishing-window.md). Store pages stay "#" until the apps are published.
IOS_DOWNLOAD_URL = "#"
ANDROID_DOWNLOAD_URL = "#"
# 10-character Apple Developer Team ID of the paid membership. Empty keeps iPhone links opening in the browser.
APPLE_TEAM_ID = ""
# Comma-separated SHA-256 signing-certificate fingerprints. The first is the Play upload key; add the Play App Signing
# key from Play Console > Test and release > App signing so Play-installed copies open shared links directly.
ANDROID_CERT_SHA256 = "37:B7:79:41:88:76:24:F6:05:43:A0:84:48:40:1E:AF:87:26:74:53:5C:D0:99:C4:81:36:96:52:3F:74:59:F6"

[[routes]]
pattern = "fishing.fishnz.space"
custom_domain = true

[[d1_databases]]
binding = "RULES_DB"
database_name = "catchcheck-rules"
database_id = "187f606b-c1d2-4552-b247-f112615e953f"
migrations_dir = "migrations"

[triggers]
crons = ["0 16 * * *"]
