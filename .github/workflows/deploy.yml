name: Deploy

# Manual only. Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit,
# and Workers Routes: Edit + DNS: Edit on the fishnz.space zone) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      api:
        description: Apply database migrations and deploy the API Worker
        type: boolean
        default: true
      cms:
        description: Deploy the admin CMS
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  api:
    name: Migrate and deploy the API
    if: ${{ inputs.api && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/fishial-proxy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/fishial-proxy/package-lock.json
      - name: Check Cloudflare credentials
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the repository secret $name (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.success == true and .result.status == "active"' > /dev/null \
            || { echo "::error::The Cloudflare API token is not valid or not active."; exit 1; }
      - run: npm ci
      - name: Run the API tests
        run: npm test
      - name: Show pending migrations
        run: npx wrangler d1 migrations list RULES_DB --remote
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply RULES_DB --remote
      - name: Deploy the Worker
        run: npx wrangler deploy
      - name: Check the live version
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=""
          for attempt in 1 2 3 4 5 6; do
            actual=$(curl -fsS https://fishing.fishnz.space/__health | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || true)
            if [ "$actual" = "$expected" ]; then
              echo "The API is live at version $actual."
              echo "### API deployed: version $actual" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live API reports version '$actual', expected '$expected'."
          exit 1

  cms:
    name: Deploy the admin CMS
    needs: api
    if: ${{ !cancelled() && inputs.cms && github.ref == 'refs/heads/main' && (needs.api.result == 'success' || needs.api.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Cloudflare credentials
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the repository secret $name (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run lint
      - name: Build and deploy
        run: npm run deploy
      - name: Check the live CMS
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://cms.fishnz.space/admin || true)
            if [ "$status" = "200" ]; then
              echo "The CMS is live."
              echo "### Admin CMS deployed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The CMS answered with status '$status'."
          exit 1
