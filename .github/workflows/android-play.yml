name: Google Play bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code (higher than every previously uploaded bundle)
        required: false
        type: string
      version_name:
        description: Public version name (leave blank to use version.properties)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare production configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          for name in ('GOOGLE_SERVICES_JSON', 'PLAY_UPLOAD_KEYSTORE_BASE64'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required repository secret: {name}')
          json.loads(os.environ['GOOGLE_SERVICES_JSON'])
          Path('app/google-services.json').write_text(os.environ['GOOGLE_SERVICES_JSON'])
          Path('play-upload.jks').write_bytes(base64.b64decode(''.join(os.environ['PLAY_UPLOAD_KEYSTORE_BASE64'].split()), validate=True))
          Path('secrets.properties').write_text('FISH_ID_API_BASE_URL=https://fishing.fishnz.space\n')
          PY
      - name: Test and build signed release
        env:
          PLAY_UPLOAD_STORE_FILE: play-upload.jks
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          python3 tools/version.py check
          args=()
          if [ -n "$PLAY_VERSION_CODE" ]; then args+=("-PplayVersionCode=$PLAY_VERSION_CODE"); fi
          if [ -n "$PLAY_VERSION_NAME" ]; then args+=("-PplayVersionName=$PLAY_VERSION_NAME"); fi
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease "${args[@]}"
      - name: Check native library compatibility
        run: python3 tools/check_android_native.py app/build/outputs/bundle/release/app-release.aab
      - name: Verify bundle signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-days-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove private build configuration
        if: always()
        run: rm -f app/google-services.json secrets.properties play-upload.jks
