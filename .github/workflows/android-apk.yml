name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build downloadable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare temporary app configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "catchcheck-ci-build",
              "storage_bucket": "catchcheck-ci-build.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000000:android:000000000000000000000000",
                "android_client_info": { "package_name": "nz.fishingnz.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "CI_BUILD_ONLY_NOT_A_REAL_KEY" }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          JSON
          fi

          printf 'FISH_ID_API_BASE_URL=https://fishing.fishnz.space\n' > secrets.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_NUMBER: ${{ github.run_number }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#FishingDaysNZ-debug.apk" \
            --target "$COMMIT_SHA" \
            --title "Android build #$RELEASE_NUMBER (attempt $RELEASE_ATTEMPT)" \
            --notes "Automated debug APK built from commit $COMMIT_SHA." \
            --prerelease

      - name: Add download link to run summary
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/android-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          {
            echo '## Android APK ready'
            echo
            echo "Built from commit \`${GITHUB_SHA}\`."
            echo
            echo "[Download the APK from Releases]($RELEASE_URL)"
            echo
            echo 'This is an automated debug build. Without GOOGLE_SERVICES_JSON, the APK uses CI-only Firebase configuration. The fishing map does not require a Google Maps API key.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary app configuration
        if: always()
        run: rm -f app/google-services.json secrets.properties

      # Housekeeping so history does not pile up: only the newest build stays in Releases, and each
      # workflow keeps its latest runs. A failure here never fails the build.
      - name: Remove older builds and workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          KEEP_RUNS: '5'
        run: |
          set -euo pipefail
          older='$3 + 0 < n || ($3 + 0 == n && $4 + 0 < a)'

          # Builds older than this one. A release is deleted together with its tag.
          builds=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E '^android-build-[0-9]+-[0-9]+$' || true; } \
            | awk -F- -v n="$RUN_NUMBER" -v a="$RUN_ATTEMPT" "$older")
          for tag in $builds; do
            gh release delete "$tag" --cleanup-tag --yes
          done

          # Tags left without a release.
          tags=$(git ls-remote --tags --refs origin 'refs/tags/android-build-*' | cut -f2 | sed 's#^refs/tags/##' \
            | { grep -E '^android-build-[0-9]+-[0-9]+$' || true; } \
            | awk -F- -v n="$RUN_NUMBER" -v a="$RUN_ATTEMPT" "$older")
          for tag in $tags; do
            git push origin --delete "refs/tags/$tag"
          done

          # Finished runs beyond the newest KEEP_RUNS of each workflow, and every run of a workflow
          # whose file no longer exists. This run is never touched.
          active=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | .id' | tr '\n' ' ')
          # Without a list of live workflows nothing can be judged to be orphaned, so stop.
          if [ -z "${active// /}" ]; then echo '::warning::Could not list workflows; skipping run cleanup.'; exit 1; fi
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.workflow_id) \(.id) \(.status)"' \
            | awk -v keep="$KEEP_RUNS" -v current="$GITHUB_RUN_ID" -v active=" $active" '
                $3 != "completed" || $2 == current { next }
                index(active, " " $1 " ") == 0 { print $2; next }
                ++seen[$1] > keep { print $2 }')
          for id in $runs; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
          done

          {
            echo '### Housekeeping'
            echo "Removed $(echo $builds $tags | wc -w) older build(s) and $(echo $runs | wc -w) old workflow run(s)."
          } >> "$GITHUB_STEP_SUMMARY"
